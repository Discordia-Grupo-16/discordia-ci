name: CI
 
on:
  workflow_call:
    inputs:
      python-version:
        type: string
        default: "3.12"
 
      source-dir:
        description: "Paquete sobre el que se mide cobertura"
        type: string
        default: "app"
 
      coverage-threshold:
        description: "Piso de cobertura. El enunciado pide 70 en backend."
        type: number
        default: 70
 
      test-db-name:
        description: "Nombre de la base de test. Tiene que coincidir con lo que espera el conftest."
        type: string
        required: true
 
      db-user:
        type: string
        default: "postgres"
 
      db-password:
        type: string
        default: "postgres"
 
      extra-env:
        description: |
          Variables de entorno propias del servicio, una por línea (CLAVE=valor).
          Ej: IDENTITY_SERVICE_URL=http://localhost:8001
        type: string
        default: ""
 
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
 
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip
 
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
 
      - name: Ruff (lint)
        run: ruff check .
 
      - name: Ruff (formato)
        run: ruff format --check .
 
  test:
    runs-on: ubuntu-latest
 
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ${{ inputs.db-user }}
          POSTGRES_PASSWORD: ${{ inputs.db-password }}
          POSTGRES_DB: ${{ inputs.test-db-name }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ${{ inputs.db-user }}"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
 
    env:
      DATABASE_URL: postgresql+psycopg://${{ inputs.db-user }}:${{ inputs.db-password }}@localhost:5432/${{ inputs.test-db-name }}
 
    steps:
      - uses: actions/checkout@v4
 
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip
 
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
 
      - name: Variables de entorno del servicio
        if: inputs.extra-env != ''
        run: echo "${{ inputs.extra-env }}" >> "$GITHUB_ENV"
 
      - name: Tests + gate de cobertura
        run: |
          pytest tests/ \
            --cov=${{ inputs.source-dir }} \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=${{ inputs.coverage-threshold }}
 
      - name: Subir reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.event.repository.name }}
          path: coverage.xml
          retention-days: 14
 
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
 
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar gitleaks
        run: |
          wget -qO- https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar xz gitleaks
          sudo mv gitleaks /usr/local/bin/
 
      - name: Escanear historial
        run: gitleaks detect --source . --verbose
 